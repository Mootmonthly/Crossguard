<title>Crossguard Skill Forge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: workbench — skill index on the left, the open skill's form on the right; stacks on phones. */
:root {
  --bg: #eef1f4;
  --surface: #ffffff;
  --sunken: #f5f7f9;
  --ink: #1a2230;
  --muted: #5a6577;
  --line: #d6dce4;
  --accent: #0d7472;
  --accent-ink: #ffffff;
  --accent-soft: #d9efee;
  --warn: #a8570b;
  --warn-soft: #fbecd9;
  --bad: #b3261e;
  --bad-soft: #fbe3e1;
  --good: #2b7a3d;
  --cat-active: #b7791f;
  --cat-spell: #6d4bc4;
  --cat-art: #0d7472;
  --cat-passive: #607089;
  --font-display: "Cinzel", "Trajan Pro", Georgia, serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --surface: #1a2029; --sunken: #151a22; --ink: #e4e8ee; --muted: #9aa5b5;
    --line: #2c3542; --accent: #3fb7b3; --accent-ink: #08201f; --accent-soft: #163634;
    --warn: #e6a35a; --warn-soft: #3a2a16; --bad: #f08a82; --bad-soft: #3d1c1a; --good: #6cc581;
    --cat-active: #e0a64a; --cat-spell: #a98cf0; --cat-art: #3fb7b3; --cat-passive: #8d9bb2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --surface: #1a2029; --sunken: #151a22; --ink: #e4e8ee; --muted: #9aa5b5;
  --line: #2c3542; --accent: #3fb7b3; --accent-ink: #08201f; --accent-soft: #163634;
  --warn: #e6a35a; --warn-soft: #3a2a16; --bad: #f08a82; --bad-soft: #3d1c1a; --good: #6cc581;
  --cat-active: #e0a64a; --cat-spell: #a98cf0; --cat-art: #3fb7b3; --cat-passive: #8d9bb2;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.brand { display: flex; flex-direction: column; gap: 2px; margin-right: auto; }
.brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; letter-spacing: .04em; margin: 0; text-wrap: balance; }
.brand p { margin: 0; color: var(--muted); max-width: 60ch; }
.sync-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--sunken); border: 1px solid var(--line); font-size: .85rem; }
.sync-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sync-chip.pending { background: var(--warn-soft); border-color: transparent; color: var(--warn); }
.sync-chip.pending .dot { background: var(--warn); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: var(--radius); cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: .85rem; }

.notice { padding: 10px 14px; border-radius: var(--radius); background: var(--warn-soft); color: var(--warn); }

.workbench { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 820px) { .workbench { grid-template-columns: minmax(0, 1fr); } }

/* Skill index */
.index { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); display: flex; flex-direction: column; min-width: 0; }
.index-tools { padding: 12px; display: flex; flex-direction: column; gap: 8px; border-bottom: 1px solid var(--line); }
.index-tools input[type="search"] { width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunken); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 2px 10px; font-size: .8rem; cursor: pointer; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.skill-list { list-style: none; margin: 0; padding: 4px; max-height: 70vh; overflow-y: auto; }
@media (max-width: 820px) { .skill-list { max-height: 40vh; } }
.skill-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; padding: 8px 10px; border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; width: 100%; text-align: left; background: none; }
.skill-item:hover { background: var(--sunken); }
.skill-item[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
.skill-item .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill-item .meta { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: .8rem; }
.skill-item .id { font-family: var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.skill-item.deleted .name { text-decoration: line-through; color: var(--muted); }
.cost { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: .8rem; display: inline-flex; align-items: center; gap: 4px; }
.cost::before { content: ""; width: 9px; height: 9px; background: currentColor; transform: rotate(45deg); border-radius: 1px; }
.cat { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.rarity { font-size: .72rem; font-weight: 600; letter-spacing: .03em; }
.rarity.unset { color: var(--muted); font-weight: 400; font-style: italic; }
.cat.Active { color: var(--cat-active); } .cat.Spell { color: var(--cat-spell); } .cat.Art { color: var(--cat-art); } .cat.Passive { color: var(--cat-passive); }
.pending-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: auto; }
.list-empty { padding: 20px 14px; color: var(--muted); }

/* Editor */
.editor { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.editor-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.editor-head h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; letter-spacing: .03em; text-wrap: balance; }
.editor-head .summary { color: var(--muted); font-size: .9rem; width: 100%; }
.editor-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
.editor-body { padding: 18px; display: flex; flex-direction: column; gap: 22px; }
.editor-empty { padding: 40px 24px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.editor-empty strong { color: var(--ink); font-size: 1.05rem; }

fieldset { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
legend { font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 0; margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: .82rem; color: var(--muted); }
.field input, .field select, .field textarea, .row input, .row select {
  padding: 6px 9px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunken); min-width: 0; width: 100%;
}
.field input[readonly] { background: transparent; border-style: dashed; color: var(--muted); }
.field textarea { min-height: 70px; resize: vertical; }
.field.wide { grid-column: 1 / -1; }
.hint { font-size: .78rem; color: var(--muted); }
.mono { font-family: var(--font-mono); }

.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.check { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px 2px 6px; font-size: .82rem; cursor: pointer; background: var(--sunken); }
.check:has(input:checked) { background: var(--accent-soft); border-color: var(--accent); }

.tokens { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunken); }
.token { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-mono); font-size: .8rem; padding: 2px 4px 2px 8px; border-radius: 4px; background: var(--surface); border: 1px solid var(--line); }
.token.unknown { border-color: var(--bad); color: var(--bad); }
.token button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 0 4px; }
.tokens input { border: 0; background: transparent; flex: 1 1 120px; min-width: 100px; padding: 3px 4px; font-family: var(--font-mono); font-size: .85rem; }

.rows { display: flex; flex-direction: column; gap: 8px; }
.row { display: grid; gap: 8px; align-items: end; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--sunken); }
.row label { display: flex; flex-direction: column; gap: 3px; font-size: .75rem; color: var(--muted); min-width: 0; }
.row .remove { align-self: center; }
.row.mod { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.row.dmg { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.row.heal { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); }
.row .reads { grid-column: 1 / -1; font-size: .8rem; color: var(--ink); }
.row .cond { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row .cond select { width: auto; }
.row .cond input[type="text"] { flex: 1 1 200px; }

.errors { border-radius: var(--radius); background: var(--bad-soft); color: var(--bad); padding: 10px 14px; }
.errors ul { margin: 6px 0 0; padding-left: 18px; }
.status { font-size: .85rem; color: var(--muted); min-height: 1.2em; }
.status.ok { color: var(--good); } .status.bad { color: var(--bad); }
.badge-pending { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); }
.badge-deleted { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--bad-soft); color: var(--bad); }
@media (prefers-reduced-motion: no-preference) { .skill-item, .btn, .check { transition: background-color .12s, border-color .12s; } }
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Skill Forge</h1>
      <p>Edit Crossguard's Skill Gems. Saved changes wait here until you ask Claude to sync them into <span class="mono">Skills.json</span>.</p>
    </div>
    <span class="sync-chip" id="sync-chip"><span class="dot"></span><span id="sync-text">Connecting…</span></span>
    <button class="btn primary" id="new-skill" type="button">New skill</button>
  </header>
  <div class="notice" id="notice" hidden></div>

  <div class="workbench">
    <aside class="index" aria-label="Skills">
      <div class="index-tools">
        <input type="search" id="search" placeholder="Search name or id" aria-label="Search skills">
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
      </div>
      <ul class="skill-list" id="skill-list"></ul>
    </aside>

    <section class="editor" id="editor" aria-live="polite">
      <div class="editor-empty" id="editor-empty">
        <strong>Waiting for the skill list</strong>
        <span>Skills appear on the left once the forge connects. Pick one to edit it, or start a new skill.</span>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
  // Schema enums — keep in step with docs/skill-data-schema.md and Tools/validate_skills.py.
  const CATEGORIES = ["Active", "Spell", "Art", "Passive"];
  const TAGS = ["Minion", "Buff", "Debuff", "Summon", "Heal", "Raid"];
  const MELEE = ["Sword", "Axe", "Dagger", "Spear", "Mace", "Quarterstaff", "Hammer", "Shield", "AnyMelee", "TwoHandedMelee"];
  const RANGED = ["Bow", "Crossbow", "Sling", "Throwing"];
  const CASTING = ["Wand", "MagicStaff"];
  const WEAPONS = [...MELEE, ...RANGED, ...CASTING];
  const ARMOR = ["Plate", "PlateAllSlots"];
  const STATS = ["STR", "AGI", "INT", "AllAttributes", "MHP", "MHPB", "AD", "AAD", "ADB", "AR", "AP", "Dexterity", "ActionSpeed", "MoveSpeed", "PH", "APH", "PHB", "MD", "AMD", "MDB", "MR", "MH", "AMH", "MHB", "CDR", "CastTime"];
  const OPS = ["Flat", "Percent", "Multiply"];
  const TARGETS = ["Self", "Party", "AlliesInRadius", "Target"];
  const FILTERS = ["Melee", "Ranged", "Minion", "Active", "Spell", "Art"];
  const COND_TYPES = { none: "Always", wielding: "While wielding", armor: "With armor", perEmptyArmorSlot: "Per empty armor slot", onActivation: "On activation", nextAttack: "Next attack", other: "Other (describe)" };
  const DMG_TYPES = ["Attack", "Magic"];
  const DMG_KINDS = ["Impact", "Splash", "PerSecond", "OverTime", "Additional", "WeaponPercent"];
  const HEAL_TYPES = ["Physical", "Magical"];
  const SOURCES = ["SkillsDoc", "StatsDoc", "Editor"];
  // Skill Gem rarity: loot drop chances only, never the skill's effect. null = not assigned yet.
  const RARITIES = ["Common", "Uncommon", "Rare", "Epic", "Legendary", "Mystic"];
  const ID_RE = /^[a-z][a-z0-9]*(_[a-z0-9]+)*$/;

  const $ = (id) => document.getElementById(id);
  function h(tag, attrs = {}, ...children) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const c of children.flat()) if (c !== null && c !== undefined && c !== false) el.append(c instanceof Node ? c : String(c));
    return el;
  }
  const clone = (v) => JSON.parse(JSON.stringify(v));
  const nowIso = () => new Date().toISOString();

  // ---- State ----
  let db = null;
  let canWrite = true;
  const store = new Map(); // id -> { skill, meta }
  let selectedId = null;
  let draft = null;        // skill being edited (clone)
  let isNew = false;
  let dirty = false;
  let filterCat = "All";
  let deleteArmed = false;
  let saving = false;

  function isPending(entry) {
    const m = entry.meta || {};
    return !!m.deleted || !m.syncedAt || (m.updatedAt && m.updatedAt > m.syncedAt);
  }

  // ---- Derived values ----
  function weaponTagFor(weapons) {
    if (!weapons.length) return null;
    if (weapons.every((w) => MELEE.includes(w))) return "Melee";
    if (weapons.every((w) => RANGED.includes(w))) return "Ranged";
    if (weapons.every((w) => CASTING.includes(w))) return null; // Spells: neither Melee nor Ranged
    return undefined; // invalid mix
  }
  function pct(v) { return `${+(v * 100).toFixed(3)}%`; }
  function describeModifier(m) {
    const sign = m.value < 0 ? "−" : "+";
    let amount;
    if (m.op === "Flat") amount = `${sign}${Math.abs(m.value)} ${m.stat}`;
    else if (m.op === "Percent") amount = `${sign}${pct(Math.abs(m.value))} ${m.stat}`;
    else amount = `${m.stat} ×${m.value}`;
    const bits = [amount];
    if (m.skillFilter) bits.push(`on ${m.skillFilter} skills`);
    if (m.target !== "Self") bits.push(`to ${m.target}`);
    const c = m.condition;
    if (c) {
      const [k, v] = Object.entries(c)[0] || [];
      if (k === "wielding") bits.push(`while wielding ${v.join(" or ")}`);
      else if (k === "armor") bits.push(`with ${v}`);
      else if (k === "perEmptyArmorSlot") bits.push("per empty armor slot");
      else if (k === "onActivation") bits.push("on activation");
      else if (k === "nextAttack") bits.push("on the next attack");
      else if (k === "other") bits.push(`(${v})`);
    }
    if (m.durationSec) bits.push(`for ${m.durationSec} s`);
    return bits.join(" ");
  }
  function summary(s) {
    const bits = [s.category, s.rarity ? `${s.rarity} gem` : "rarity not set", `${s.capacityCost} Capacity`];
    if (s.cooldownSec != null) bits.push(`${s.cooldownSec} s cooldown`);
    if (s.durationSec != null) bits.push(`lasts ${s.durationSec} s`);
    if (s.weaponTag) bits.push(s.weaponTag);
    return bits.join(" · ");
  }

  // ---- Validation (mirrors Tools/validate_skills.py) ----
  function validate(s) {
    const errs = [];
    if (!ID_RE.test(s.id || "")) errs.push("Id must be snake_case, e.g. frost_nova.");
    if (isNew && store.has(s.id)) errs.push(`Id "${s.id}" is already used.`);
    if (!s.name || !s.name.trim()) errs.push("Name is required.");
    if (!Number.isInteger(s.capacityCost) || s.capacityCost < 0) errs.push("Capacity cost must be a whole number, 0 or more.");
    if (!CATEGORIES.includes(s.category)) errs.push("Pick a category.");
    if (s.rarity !== null && !RARITIES.includes(s.rarity)) errs.push("Rarity must be one of the listed rarities, or not set.");
    const tag = weaponTagFor(s.requirements.weapons);
    if (tag === undefined) errs.push("Required weapons mix melee, ranged and casting weapons; split them into separate skills.");
    const req = s.requirements.weapons;
    if (s.category === "Spell" && !(req.length === CASTING.length && CASTING.every((w) => req.includes(w))))
      errs.push("Every Spell requires a casting weapon: tick exactly Wand and MagicStaff (Two-Handed Staff).");
    for (const field of ["cooldownSec", "durationSec"]) {
      const v = s[field];
      if (v !== null && !(typeof v === "number" && v >= 0)) errs.push(`${field === "cooldownSec" ? "Cooldown" : "Duration"} must be a number, 0 or more, or blank.`);
    }
    if (s.category === "Passive" && s.cooldownSec !== null) errs.push("Passive skills have no cooldown; clear it.");
    const known = new Set([...store.keys(), s.id]);
    for (const field of ["includes", "grantsWhileActive", "minionSkills"]) {
      for (const ref of s[field]) {
        if (ref === s.id) errs.push(`${labelFor(field)} cannot list the skill itself.`);
        else if (!known.has(ref)) errs.push(`${labelFor(field)}: no skill with id "${ref}".`);
      }
    }
    s.statModifiers.forEach((m, i) => {
      const where = `Stat modifier ${i + 1}`;
      if (typeof m.value !== "number" || Number.isNaN(m.value)) errs.push(`${where}: value must be a number.`);
      if (m.skillFilter && !["CDR", "CastTime"].includes(m.stat)) errs.push(`${where}: "applies to skills" only works with CDR or CastTime.`);
      if (m.condition && m.condition.wielding && !m.condition.wielding.length) errs.push(`${where}: pick at least one weapon for "While wielding".`);
      if (m.condition && "other" in m.condition && !m.condition.other.trim()) errs.push(`${where}: describe the condition.`);
      if (m.durationSec !== null && !(m.durationSec > 0)) errs.push(`${where}: duration must be above 0, or blank for permanent.`);
    });
    s.damage.forEach((d, i) => {
      const where = `Damage ${i + 1}`;
      if (typeof d.amount !== "number" || Number.isNaN(d.amount)) errs.push(`${where}: amount must be a number.`);
      if (typeof d.coefficient !== "number" || Number.isNaN(d.coefficient)) errs.push(`${where}: coefficient must be a number (1 if none).`);
      if (!Number.isInteger(d.hits) || d.hits < 1) errs.push(`${where}: hits must be a whole number, 1 or more.`);
      if (["PerSecond", "OverTime"].includes(d.kind) && !(d.durationSec > 0)) errs.push(`${where}: ${d.kind} damage needs a duration.`);
    });
    s.healing.forEach((x, i) => {
      const where = `Healing ${i + 1}`;
      if (x.full && x.amount !== null) errs.push(`${where}: full healing has no amount; clear it.`);
      if (!x.full && typeof x.amount !== "number") errs.push(`${where}: enter an amount or tick "Full".`);
    });
    if (!s.description || !s.description.trim()) errs.push("Description is required.");
    return errs;
  }
  const labelFor = (f) => ({ includes: "Includes", grantsWhileActive: "Grants while active", minionSkills: "Minion skills" })[f];

  function blankSkill() {
    return {
      id: "", name: "", capacityCost: 1, category: "Active", rarity: null, weaponTag: null, tags: [],
      requirements: { weapons: [], armor: null, items: [], forms: [] },
      cooldownSec: 10, durationSec: null, includes: [], grantsWhileActive: [], minionSkills: [],
      statModifiers: [], damage: [], healing: [], mechanics: [], description: "", source: "Editor", notes: [],
    };
  }

  // ---- Index ----
  function renderFilters() {
    const wrap = $("filters");
    wrap.replaceChildren(...["All", ...CATEGORIES, "No rarity", "Pending"].map((c) =>
      h("button", { class: "filter", type: "button", "aria-pressed": String(filterCat === c), onclick: () => { filterCat = c; renderFilters(); renderList(); } }, c)));
  }
  function renderList() {
    const q = $("search").value.trim().toLowerCase();
    const items = [...store.entries()]
      .filter(([id, e]) => filterCat === "All" || (filterCat === "Pending" ? isPending(e)

  }
  async function copyJson() {
    const text = JSON.stringify(draft, null, 2);
    try { await navigator.clipboard.writeText(text); setStatus("Skill JSON copied.", "ok"); }
    catch { setStatus("Copy was blocked here. Select the text from Claude's sync instead.", "bad"); }
  }

  // ---- Boot ----
  $("search").addEventListener("input", renderList);
  $("new-skill").addEventListener("click", startNew);
  renderFilters();

  (async () => {
    if (!window.claude || !window.claude.use) { showOffline(); return; }
    const [dbNs, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    db = dbNs;
    if (!db) { showOffline(); return; }
    if (user && typeof user.can === "function") {
      try { const allowed = await user.can("data.write"); if (allowed === false) canWrite = false; } catch {}
    }
    if (!canWrite) { const n = $("notice"); n.hidden = false; n.textContent = "You can browse these skills but not change them. Ask the owner for edit access."; $("new-skill").disabled = true; }
    db.collection("skills").onSnapshot((snap) => {
      for (const ch of snap.docChanges()) {
        if (ch.type === "removed") { store.delete(ch.doc.id); continue; }
        const data = ch.doc.data();
        if (data && data.skill) {
          const entry = clone(data);
          // Saved before rarity existed.
          if (!("rarity" in entry.skill)) entry.skill.rarity = null;
          store.set(ch.doc.id, entry);
        }
      }
      if (selectedId && !store.has(selectedId) && !isNew) { selectedId = null; draft = null; }
      // Pick up other edits to the open skill unless the viewer is mid-edit.
      if (selectedId && !dirty && !isNew && store.has(selectedId)) draft = clone(store.get(selectedId).skill);
      renderList(); renderSyncChip();
      if (!dirty) renderEditor();
    }, (err) => {
      const n = $("notice"); n.hidden = false;
      n.textContent = err.code === "revoked" ? "Access to the skill store ended. Reload to reconnect." : "Lost the live connection to the skill store. Reload the page.";
    });
  })();

  function showOffline() {
    const n = $("notice"); n.hidden = false;
    n.textContent = "Open this page in claude.ai while signed in to load and edit skills.";
    $("new-skill").disabled = true; renderSyncChip(); renderEditor();
  }
})();
</script>
