[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Crossguard
CopyrightNotice=

[/Script/GameplayAbilities.AbilitySystemGlobals]
+GameplayCueNotifyPaths=/Game/GameplayCues

; Nakama (docs/backend-setup.md). ServerKey must match NAKAMA_SERVER_KEY in Backend/.env. The HTTP key is
; never configured here: dedicated servers get it from -NakamaHttpKey= or CROSSGUARD_NAKAMA_HTTP_KEY.
[/Script/Crossguard.CrossguardNakamaSubsystem]
; Quoted: unquoted, the ini parser cuts the value at "//" (the client read "http:").
NakamaUrl="http://127.0.0.1:7350"
ServerKey=crossguard-dev
RequestTimeoutSeconds=10.0

; Spell projectiles' placeholder look (Fireball), under a projectile Blueprint's own (ACrossguardSpellProjectile).
[/Script/Crossguard.CrossguardSpellProjectile]
DefaultSpellVisual=(TrailVfx="/Game/NiagaraExamples/FX_Misc/NS_Fire.NS_Fire",ImpactVfx="/Game/NiagaraExamples/FX_Explosions/NS_Explosion_Medium.NS_Explosion_Medium")
